version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctf-xss-web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/data
      - FLAG_LAB01=${FLAG_LAB01:-UbigCTF{r3fl3ct3d_xss_b4s1c_h7ml_c0nt3xt}}
      - FLAG_LAB02=${FLAG_LAB02:-UbigCTF{st0r3d_xss_1n_c0mm3nts_d4t4b4s3}}
      - FLAG_LAB03=${FLAG_LAB03:-UbigCTF{d0m_xss_d0cum3nt_wr1t3_tr4ck3r}}
      - FLAG_LAB04=${FLAG_LAB04:-UbigCTF{d0m_xss_1nn3r_h7ml_s34rch}}
      - FLAG_LAB05=${FLAG_LAB05:-UbigCTF{d0m_xss_jqu3ry_4nch0r_hr3f}}
      - FLAG_LAB06=${FLAG_LAB06:-UbigCTF{d0m_xss_jqu3ry_s3l3ct0r_h4shch4ng3}}
      - FLAG_LAB07=${FLAG_LAB07:-UbigCTF{r3fl3ct3d_4ttr1but3_qu0t3_br34k}}
      - FLAG_LAB08=${FLAG_LAB08:-UbigCTF{st0r3d_xss_hr3f_j4v4scr1pt_sch3m3}}
      - FLAG_LAB09=${FLAG_LAB09:-UbigCTF{r3fl3ct3d_js_str1ng_3sc4p3}}
      - FLAG_LAB10=${FLAG_LAB10:-UbigCTF{d0m_xss_s3l3ct_d0cum3nt_wr1t3}}
    volumes:
      - lab-data:/data:rw
    tmpfs:
      - /tmp:rw
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  lab-data:
